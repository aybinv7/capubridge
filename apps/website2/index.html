<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts: preconnect + direct <link> (not a CSS @import, which chains and
         blocks render). display=optional avoids a post-paint swap → no CLS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=optional"
    />
    <meta
      name="description"
      content="Capubridge is a native desktop workbench for debugging Android WebViews on real devices: ADB device control, automatic CDP port forwarding, storage, DOM, network, logcat, performance, mirroring and session recording in one window."
    />
    <title>Capubridge — Android WebView debugging workbench</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
